name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  maven-test:
    name: Maven tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run API gateway tests
        working-directory: services/api-gateway-service
        run: ./mvnw --batch-mode --no-transfer-progress test
