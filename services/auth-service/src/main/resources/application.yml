server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mm_auth}
    username: ${DB_USERNAME:mm_auth}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    # Enable once discovery-service exists.
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

auth:
  internal:
    account-sync:
      enabled: ${AUTH_INTERNAL_ACCOUNT_SYNC_ENABLED:false}
      token: ${AUTH_INTERNAL_ACCOUNT_SYNC_TOKEN:}
  jwt:
    issuer: ${AUTH_JWT_ISSUER:auth-service}
    audience: ${AUTH_JWT_AUDIENCE}
    access-ttl: ${AUTH_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${AUTH_JWT_REFRESH_TTL:30d}
    private-key-path: ${AUTH_JWT_PRIVATE_KEY_PATH}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  tokens:
    email-verification-ttl: ${AUTH_EMAIL_VERIFICATION_TTL:24h}
    password-reset-ttl: ${AUTH_PASSWORD_RESET_TTL:30m}
    resend-cooldown: ${AUTH_EMAIL_RESEND_COOLDOWN:60s}
  mail:
    # false: không gửi email (chỉ ghi log); true: gửi qua SMTP cấu hình bằng SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD.
    enabled: ${AUTH_MAIL_ENABLED:false}
    from: ${AUTH_MAIL_FROM:no-reply@mentor-matching.local}
    verify-email-url: ${AUTH_VERIFY_EMAIL_URL:http://localhost:5173/verify-email}
    reset-password-url: ${AUTH_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
    # CHỈ cho phát triển local khi enabled=false: ghi link (chứa token) ra log.
    log-links: ${AUTH_MAIL_LOG_LINKS:false}
  cookie:
    path: ${AUTH_COOKIE_PATH:/api/v1/auth}
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
