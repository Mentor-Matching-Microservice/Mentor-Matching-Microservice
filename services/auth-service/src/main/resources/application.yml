server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mm_auth}
    username: ${DB_USERNAME:mm_auth}
    password: ${DB_PASSWORD:mm_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    # Cùng tên biến môi trường với payment-service.
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Outbox chỉ đánh dấu đã gửi khi broker xác nhận.
    publisher-confirm-type: correlated
    # Broker treo/mất kết nối thì báo lỗi nhanh (mặc định RPC chờ tới 10 phút), outbox sẽ gửi bù sau.
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    channel-rpc-timeout: ${RABBITMQ_CHANNEL_RPC_TIMEOUT:5s}
    requested-heartbeat: ${RABBITMQ_HEARTBEAT:10s}

eureka:
  client:
    # Enable once discovery-service exists.
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

auth:
  internal:
    account-sync:
      enabled: ${AUTH_INTERNAL_ACCOUNT_SYNC_ENABLED:false}
      token: ${AUTH_INTERNAL_ACCOUNT_SYNC_TOKEN:}
  jwt:
    issuer: ${AUTH_JWT_ISSUER:auth-service}
    audience: ${AUTH_JWT_AUDIENCE:mentor-matching-api}
    access-ttl: ${AUTH_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${AUTH_JWT_REFRESH_TTL:30d}
    private-key-path: ${AUTH_JWT_PRIVATE_KEY_PATH:jwt-keys/private.pem}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  tokens:
    email-verification-ttl: ${AUTH_EMAIL_VERIFICATION_TTL:24h}
    password-reset-ttl: ${AUTH_PASSWORD_RESET_TTL:30m}
    resend-cooldown: ${AUTH_EMAIL_RESEND_COOLDOWN:60s}
  mail:
    # false: không gửi email (chỉ ghi log); true: gửi qua SMTP cấu hình bằng SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD.
    enabled: ${AUTH_MAIL_ENABLED:false}
    from: ${AUTH_MAIL_FROM:no-reply@mentor-matching.local}
    verify-email-url: ${AUTH_VERIFY_EMAIL_URL:http://localhost:5173/verify-email}
    reset-password-url: ${AUTH_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
    # CHỈ cho phát triển local khi enabled=false: ghi link (chứa token) ra log.
    log-links: ${AUTH_MAIL_LOG_LINKS:false}
  messaging:
    # false: không publish/nhận sự kiện (outbox vẫn được ghi và sẽ gửi bù khi bật lại).
    enabled: ${AUTH_MESSAGING_ENABLED:true}
    exchange: ${AUTH_EVENTS_EXCHANGE:mentor.events}
    queue: ${AUTH_EVENTS_QUEUE:auth.mentor-events}
    routing-keys: ${AUTH_EVENTS_ROUTING_KEYS:mentor.#}
    max-retries: ${AUTH_EVENTS_MAX_RETRIES:4}
    confirm-timeout: ${AUTH_EVENTS_CONFIRM_TIMEOUT:5s}
    publish-delay: ${AUTH_OUTBOX_PUBLISH_DELAY:2s}
  cookie:
    path: ${AUTH_COOKIE_PATH:/api/v1/auth}
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
