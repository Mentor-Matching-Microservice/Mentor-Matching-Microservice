server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: review-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=mm_review;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    # Enable once discovery-service exists.
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

review:
  messaging:
    enabled: ${REVIEW_MESSAGING_ENABLED:true}
    exchange: ${REVIEW_MESSAGING_EXCHANGE:mentor.events}
    mentor-rating-routing-key: ${REVIEW_MENTOR_RATING_ROUTING_KEY:mentor.rating}
  jwt:
    issuer: ${AUTH_JWT_ISSUER:auth-service}
    audience: ${AUTH_JWT_AUDIENCE}
    public-key-location: ${AUTH_JWT_PUBLIC_KEY_LOCATION}
  cors:
    allowed-origins: ${REVIEW_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  services:
    booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8084}
    user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
