server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: mentor-service
              uri: ${MENTOR_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/mentors/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/catalog/**,/api/v1/locations/**,/api/v1/admin/catalog/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/scheduling/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: review-service
              uri: ${REVIEW_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/reviews/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - id: media-service
              uri: ${MEDIA_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/media/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

gateway:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
