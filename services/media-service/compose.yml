services:
  mongo:
    image: mongo:7.0
    container_name: mm-media-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mm_media_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          'try { quit(rs.status().ok ? 0 : 1); }
          catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}).ok ? quit(0) : quit(1); }'
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mm_media_data:
