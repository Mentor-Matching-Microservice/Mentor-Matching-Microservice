server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=mm_payment;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 5
          max-interval: 30s
          multiplier: 2

eureka:
  client:
    # Enable once discovery-service exists.
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

payment:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:auth-service}
    audience: ${AUTH_JWT_AUDIENCE:mentor-matching-api}
    public-key-location: ${AUTH_JWT_PUBLIC_KEY_LOCATION:file:../auth-service/jwt-keys/public.pem}
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8084}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/payments/success?session_id={CHECKOUT_SESSION_ID}}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/payments/cancel}
    reconcile-after: ${PAYMENT_RECONCILE_AFTER:PT30M}
  messaging:
    enabled: ${PAYMENT_MESSAGING_ENABLED:true}
    exchange: ${PAYMENT_EVENTS_EXCHANGE:mentor.events}
    booking-events-queue: ${PAYMENT_BOOKING_EVENTS_QUEUE:payment.booking-lifecycle}

