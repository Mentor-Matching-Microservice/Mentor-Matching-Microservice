server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3310/mm_catalog?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:mm_catalog}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

catalog:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:auth-service}
    audience: ${AUTH_JWT_AUDIENCE}
    public-key-location: ${AUTH_JWT_PUBLIC_KEY_LOCATION}
